<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rodar</title>
</head>
<body>
    <h1>Desafio do Rodízio</h1>
    <div id="saida"></div>

    <script>
        // mostrar(texto) escreve uma linha na página. Não apague.
        function mostrar(texto) {
            const linha = document.createElement("p");
            linha.textContent = texto;
            document.getElementById("saida").appendChild(linha);
        }

        // SEU CÓDIGO COMEÇA AQUI


    </script>
</body>
</html>
